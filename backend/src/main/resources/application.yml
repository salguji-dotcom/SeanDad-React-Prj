server:
  port: 8080

spring:
  application:
    name: app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app1234}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.seandad.app: debug

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    com.seandad.app: info
